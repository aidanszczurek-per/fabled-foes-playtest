<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Fabled Foes rule book</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #f0b429;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #f0b429;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #14161c;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }


            /* Fabled Foes: dark look, and the Desktop / Mobile chooser */
            .staticrypt-page { width: min(360px, 100%); }
            .staticrypt-form { background: #1e222c; color: #e6e8ee; border-radius: 12px; border: 1px solid #363c4d; }
            .staticrypt-hr { border-top-color: #363c4d; }
            .staticrypt-password-container { background: #262b38; }
            .staticrypt-form input[type="password"], input[type="text"] { color: #e6e8ee; }
            .staticrypt-toggle-password-visibility { filter: invert(1); }
            .staticrypt-form .staticrypt-decrypt-button { color: #1a1300; font-weight: 700; border-radius: 6px; }
            .staticrypt-title { color: #f0b429; font-weight: 700; margin-bottom: 0.4em; }
            .ff-device { text-align: left; margin-bottom: 14px; }
            .ff-label { font-size: 12px; color: #9aa1b3; margin: 8px 0 4px; }
            .ff-seg { display: flex; border: 1px solid #363c4d; border-radius: 8px; overflow: hidden; }
            .ff-seg button { flex: 1; padding: 11px 6px; border: 0; background: #262b38; color: #9aa1b3; font: inherit; font-size: 14px; cursor: pointer; }
            .ff-seg button.on { background: #f0b429; color: #1a1300; font-weight: 700; }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-page">
                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <p class="staticrypt-title">Fabled Foes rule book</p>
                        <p>Choose how you are reading, then enter the playtest password (the same one as the game).</p>
                    </div>

                    <hr class="staticrypt-hr" />

                    <!--FF_CHOOSER_START-->
                    <div class="ff-device">
                        <div class="ff-label">Playing on</div>
                        <div class="ff-seg" id="ff-dev">
                            <button type="button" data-v="desktop" class="on">Desktop</button>
                            <button type="button" data-v="mobile">Mobile</button>
                        </div>
                        <div id="ff-orient-wrap" class="hidden">
                            <div class="ff-label">How will you hold your phone?</div>
                            <div class="ff-seg" id="ff-ori">
                                <button type="button" data-v="portrait" class="on">Vertical</button>
                                <button type="button" data-v="landscape">Horizontal</button>
                            </div>
                        </div>
                    </div>
                    <!--FF_CHOOSER_END-->

                        <div class="staticrypt-password-container">
                            <input

                                type="password"
                                name="password"
                                placeholder="Password"
                                autofocus
                            />

                            <img

                                title="Show password"

                        </div>

                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            Remember me
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="DECRYPT" />
                    </form>
                </div>
            </div>
        </div>

            const ffGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

            function ffSave() {
                if (!document.getElementById("ff-dev")) return;   // the rule book page has no chooser: leave the saved choice alone
                try {
                    localStorage.setItem("ffpt_device", ffState.device);
                    localStorage.setItem("ffpt_orient", ffState.orient);
                    localStorage.setItem("ffpt_mobile", ffState.device === "mobile" ? "1" : "0");

            });
