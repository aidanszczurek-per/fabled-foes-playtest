<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Fabled Foes rule book</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- installable app (17/11/2026): the same tags are in the game's head; files from Tools/app/ -->
        <link rel="manifest" href="manifest.webmanifest" />
        <!-- 23/11/2026: keep the browser's install offer if it arrives while this password page is up; the game picks it up from window.FF_BIP -->
        <script>window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.FF_BIP=e;});</script>
        <meta name="theme-color" content="#f0b429" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Fabled Foes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #f0b429;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #f0b429;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #14161c;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }


            /* Fabled Foes loading (18/11/2026): the app icon's crowned skull, its purple eyes shimmer softly so it never looks frozen */
            .ff-load { position: relative; width: 120px; height: 120px; }
            .ff-load img { width: 100%; height: 100%; display: block; }
            .ff-load i { position: absolute; top: 62%; width: 22%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
                mix-blend-mode: screen; pointer-events: none; opacity: .15;
                background: radial-gradient(circle, #fff 0, #d6a8ff 18%, rgba(160, 90, 255, .5) 42%, transparent 70%);
                animation: ff-eye 2.6s ease-in-out infinite; }
            /* negative delays start the eyes already glowing (a quick load used to end before they brightened) */
            .ff-load i.l { left: 40%; animation-delay: -.9s; }
            .ff-load i.r { left: 61.5%; animation-delay: -.65s; }
            @keyframes ff-eye { 0%, 100% { opacity: .15; transform: translate(-50%, -50%) scale(.85); }
                45% { opacity: .75; transform: translate(-50%, -50%) scale(1.05); } 60% { opacity: .5; } 75% { opacity: .7; } }
            /* 18/11/2026: LOADING with running dots and a gold sweep bar under the skull; transform/opacity only so it keeps moving while the page decrypts */
            .staticrypt-spinner-container { flex-direction: column; gap: 14px; }
            /* 22/11/2026 one loading screen: white like the app's own splash (manifest background_color #ffffff), skull dead centre where the splash puts the icon,
               LOADING and the bar hang below it, so the splash and this screen look like one */
            html, .staticrypt-body { background: #ffffff; }
            #staticrypt_loading { position: fixed; inset: 0; height: auto; }
            #staticrypt_loading .ff-ltxt, #staticrypt_loading .ff-lbar { position: absolute; left: 50%; transform: translateX(-50%); }
            #staticrypt_loading .ff-ltxt { top: calc(50% + 78px); }
            #staticrypt_loading .ff-lbar { top: calc(50% + 104px); }
            .ff-ltxt { font: 13px system-ui, sans-serif; letter-spacing: .12em; color: #c9a6ff; text-transform: uppercase; }
            .ff-ltxt b { display: inline-block; font-weight: 400; animation: ff-dot 1.2s infinite; }
            .ff-ltxt b:nth-child(2) { animation-delay: .2s; } .ff-ltxt b:nth-child(3) { animation-delay: .4s; }
            @keyframes ff-dot { 0%, 100% { opacity: .2; } 40% { opacity: 1; } }
            .ff-lbar { width: 140px; height: 4px; border-radius: 2px; background: #262b38; overflow: hidden; }
            .ff-lbar span { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #f0b429, transparent);
                animation: ff-sweep 1.3s ease-in-out infinite; }
            @keyframes ff-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
            @media (prefers-reduced-motion: reduce) { .ff-load i { animation-duration: 5s; } .ff-ltxt b { animation-duration: 3s; } .ff-lbar span { animation-duration: 3s; } }

            /* Fabled Foes: dark look, and the Desktop / Mobile chooser */
            .staticrypt-page { width: min(360px, 100%); }
            .staticrypt-form { background: #1e222c; color: #e6e8ee; border-radius: 12px; border: 1px solid #363c4d; }
            .staticrypt-hr { border-top-color: #363c4d; }
            .staticrypt-password-container { background: #262b38; }
            .staticrypt-form input[type="password"], input[type="text"] { color: #e6e8ee; }
            .staticrypt-toggle-password-visibility { filter: invert(1); }
            .staticrypt-form .staticrypt-decrypt-button { color: #1a1300; font-weight: 700; border-radius: 6px; }
            .staticrypt-title { color: #f0b429; font-weight: 700; margin-bottom: 0.4em; }
            .ff-device { text-align: left; margin-bottom: 14px; }
            .ff-label { font-size: 12px; color: #9aa1b3; margin: 8px 0 4px; }
            .ff-seg { display: flex; border: 1px solid #363c4d; border-radius: 8px; overflow: hidden; }
            .ff-seg button { flex: 1; padding: 11px 6px; border: 0; background: #262b38; color: #9aa1b3; font: inherit; font-size: 14px; cursor: pointer; }
            .ff-seg button.on { background: #f0b429; color: #1a1300; font-weight: 700; }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

            const ffuGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
            // nothing saved yet (a new device, a private tab): a small touch screen starts on Mobile, held the way it is now (13/11/2026)
            let ffuPhone = false; try { ffuPhone = matchMedia("(pointer:coarse)").matches && Math.min(screen.width, screen.height) <= 540; } catch (e) {}
            const ffuDev = ffuGet("ffpt_device") || (ffuGet("ffpt_mobile") === "1" ? "mobile" : ffuGet("ffpt_mobile") === null && ffuPhone ? "mobile" : "desktop");
            const ffuOri = ffuGet("ffpt_orient") || (ffuPhone && window.innerWidth > window.innerHeight ? "landscape" : "portrait");
            const ffuState = { device: ffuDev === "mobile" ? "mobile" : "desktop", orient: ffuOri === "landscape" ? "landscape" : "portrait" };
            function ffuSave() {
                if (!document.getElementById("ff-dev")) return;   // the rule book page has no chooser: leave the saved choice alone
                try {
                    localStorage.setItem("ffpt_device", ffuState.device);
                    localStorage.setItem("ffpt_orient", ffuState.orient);
                    localStorage.setItem("ffpt_mobile", ffuState.device === "mobile" ? "1" : "0");
                } catch (e) {}
            }
            function ffuPaint() {
                if (!document.getElementById("ff-dev")) return;
                document.querySelectorAll("#ff-dev button").forEach((b) => b.classList.toggle("on", b.dataset.v === ffuState.device));
                document.querySelectorAll("#ff-ori button").forEach((b) => b.classList.toggle("on", b.dataset.v === ffuState.orient));
                document.getElementById("ff-orient-wrap").classList.toggle("hidden", ffuState.device !== "mobile");
            }
            if (document.getElementById("ff-dev")) document.getElementById("ff-dev").addEventListener("click", (e) => {
                const b = e.target.closest("button");
                if (b) { ffuState.device = b.dataset.v; ffuSave(); ffuPaint(); }
            });
            if (document.getElementById("ff-ori")) document.getElementById("ff-ori").addEventListener("click", (e) => {
                const b = e.target.closest("button");
                if (b) { ffuState.orient = b.dataset.v; ffuSave(); ffuPaint(); }
            });
            ffuPaint();

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                ffuSave();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
